name: Hoymiles DTU API
version: "1.4.0"
slug: hoymiles_dtu_api
description: Captura os dados do DTU Hoymiles na rede local e os expõe em uma API REST (JSON)
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
# painel na barra lateral do HA para ver o estado e trocar o IP do DTU
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power
panel_title: DTU Hoymiles
# permite salvar o novo IP nas opcoes do add-on
hassio_api: true
# usa o broker MQTT do HA (add-on Mosquitto), se houver
services:
  - mqtt:want
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: API REST (JSON)
watchdog: http://[HOST]:[PORT:8099]/health
options:
  dtu_host: "192.168.0.34"
  poll_interval: 5
  timeout: 5
  auto_discover: true
  mqtt_enabled: true
  power_zero_threshold_w: 0
schema:
  dtu_host: str
  poll_interval: int(2,3600)
  timeout: int(1,60)
  auto_discover: bool
  mqtt_enabled: bool
  power_zero_threshold_w: float(0,1000000)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
